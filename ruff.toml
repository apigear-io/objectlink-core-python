target-version = "py39"
line-length = 120
src = ["src"]

[lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "F821",  # undefined name in string annotations (forward references)
]

[format]
quote-style = "double"
